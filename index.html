const clean=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.replace(/[^a-z0-9 ]/gi,"").split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase();
const hue=n=>{let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h};

function logoHTML(it){
  const curated=[...(it.logoSources||[])];
  const google512="https://www.google.com/s2/favicons?sz=512&domain="+encodeURIComponent(it.domain);
  const google="https://www.google.com/s2/favicons?sz=256&domain="+encodeURIComponent(it.domain);
  const googleV2="https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url="+encodeURIComponent(it.domain)+"&size=256";
  const duck="https://icons.duckduckgo.com/ip3/"+encodeURIComponent(it.domain)+".ico";
  const direct=[
    "https://"+it.domain+"/favicon.ico",
    "https://"+it.domain+"/favicon.png",
    "https://"+it.domain+"/favicon.svg"
  ];
  const base="https://"+it.domain;
  const highResCandidates=[
    base+"/apple-touch-icon.png",
    base+"/android-chrome-192x192.png",
    base+"/favicon-192x192.png",
    base+"/logo.png"
  ];
  const local=(window.MAHIFLIX_LOGOS&&window.MAHIFLIX_LOGOS[it.domain])||"";
  const sources=[...new Set([...curated,...highResCandidates,google512,google,googleV2,...direct,duck,local].filter(Boolean))];
  if(!sources.length){
    const fallbackSvg='<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect width="1024" height="1024" rx="180" fill="#090909"/><text x="512" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="170" font-weight="800" fill="#fff">'+encodeURIComponent(initials(it.name))+'</text></svg>';
    sources.push('data:image/svg+xml;charset=UTF-8,'+fallbackSvg);
  }
  const json=JSON.stringify(sources);
  return "<img class='logo-img' loading='eager' decoding='async' fetchpriority='high' alt='"+clean(it.name)+" logo' src='"+sources[0]+"' data-logo-sources='"+clean(json)+"' data-logo-index='0' onload='logoLoaded(this)' onerror='nextLogo(this)'>";
}
function logoLoaded(img){
  const w=img.naturalWidth||0,h=img.naturalHeight||0;
  const isVector=/\.svg(?:[?#]|$)/i.test(img.currentSrc||img.src);
  const isSmall=w>0&&h>0&&(w<120||h<120)&&!isVector;
  if(img.dataset.logoLastResort==="1"){
    if(isSmall)img.classList.add("logo-small");
    img.classList.add("logo-ready");
    return;
  }
  if(isSmall){
    if(!img.dataset.logoBestSmall)img.dataset.logoBestSmall=img.src;
    nextLogo(img);
    return;
  }
  img.classList.remove("logo-small");
  img.classList.add("logo-ready");
}
function nextLogo(img){
  img.classList.remove("logo-ready");
  try{
    const sources=JSON.parse(img.getAttribute("data-logo-sources")||"[]");
    const index=Number(img.getAttribute("data-logo-index")||"0")+1;
    if(index<sources.length){
      img.setAttribute("data-logo-index",String(index));
      img.src=sources[index];
      return;
    }
  }catch(e){}
  if(img.dataset.logoBestSmall){
    img.dataset.logoLastResort="1";
    if(img.src===img.dataset.logoBestSmall){
      img.classList.add("logo-small","logo-ready");
      return;
    }
    img.src=img.dataset.logoBestSmall;
    return;
  }
  const name=img.alt.replace(/ logo$/i,"");
  img.outerHTML="<span class='initials' aria-label='"+clean(name)+" logo'>"+initials(name)+"</span>";
}
function linkOf(it){return it.url}

function qualityScore(it){
  return (it.pop*.42)+(it.smooth*.30)+(it.langs*.18)+((2-it.ads)*10);
}

const top10=[...S].sort((a,b)=>qualityScore(b)-qualityScore(a)).slice(0,10);

function bucket(arr,n){
  return arr.filter(x=>x.ads===n).sort((a,b)=>qualityScore(b)-qualityScore(a));
}

function card(it,i,isTop){
  const c1=it.color||("hsl("+hue(it.name)+" 55% 34%)");
  const c2="#0d0d0d";
  const num=isTop?"<span class='num'>"+(i+1)+"</span>":"";
  const nw=it.new?"<span class='badge'>NEW</span>":"";
  const ad=it.ads<2?"<span class='ad "+adClass[it.ads]+"'>"+(it.ads===0?"NO AD":"LESS AD")+"</span>":"";
  const url=linkOf(it);
  const isApp=it.kind==="app";
  const downloadAttr=isApp?" download":"";
  return "<div class='card logo-card live' tabindex='0' role='link' data-kind='"+(isApp?"app":"site")+"' data-download='"+(isApp?clean(url):"")+"' style='--c1:"+c1+";--c2:"+c2+"' data-name='"+clean(it.name.toLowerCase())+"' data-search='"+clean((it.name+" "+it.domain).toLowerCase())+"' data-url='"+clean(url)+"'>"+
    num+logoHTML(it)+nw+ad+
    "<a class='cap' href='"+url+"'"+(isApp?downloadAttr+" aria-label='Download "+clean(it.name)+" APK'":" target='_blank' rel='noopener noreferrer'")+" >"+clean(it.name)+(isApp?" · App":"")+"</a>"+
    "<div class='more'><div class='actions'><a class='round go' href='"+url+"'"+(isApp?downloadAttr+" aria-label='Download "+clean(it.name)+" APK'":" target='_blank' rel='noopener noreferrer'")+" >"+svgPlay()+"</a><button class='round fav' aria-label='Add to My List'>"+svgPlus()+"</button></div>"+
    "<b>"+clean(it.name)+"</b><p>"+clean(it.desc)+"</p><p class='lang'>"+clean(it.langs)+"</p></div></div>";
}

function dedupeItems(items){
  const best=new Map();
  items.forEach(function(it){
    const key=String(it.name||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"");
    const current=best.get(key);
    if(!current || qualityScore(it)>qualityScore(current))best.set(key,it);
  });
  return Array.from(best.values());
}

function renderView(type){
  const viewIds={sites:"sitesView",apps:"appsView",music:"musicView"};
  const dataSets={sites:S,apps:A,music:M};
  const labels={sites:"Websites",apps:"Apps",music:"Music Apps"};
  const el=document.getElementById(viewIds[type]);
  const data=dataSets[type];
  const label=labels[type];
  const sorted=dedupeItems(data.slice()).sort((a,b)=>qualityScore(b)-qualityScore(a));
  el.innerHTML=rowHTML(label,sorted,{kind:type==="sites"?"site":"app",note:"Your curated MahiFlix collection"});
}

function rowHTML(title,items,opts){
  if(!items.length)return "";
  var top=opts&&opts.top;
  var note=opts&&opts.note?opts.note:"";
  return "<section class='row "+(top?"top10 ":"")+"row-section' data-row='"+clean(title.toLowerCase())+"'><div class='row-head'><h2>"+clean(title)+"</h2><span class='row-note'>"+clean(note)+"</span></div><div class='rail'><button class='arrow l' aria-label='Scroll left'>&#8249;</button><div class='track'>"+items.map(function(it,i){return card(it,i,top)}).join("")+"</div><button class='arrow r' aria-label='Scroll right'>&#8250;</button></div></section>";
}

  var a=modeSwitch.querySelector(".mode.active");if(!a)return;
  if(instant)thumb.style.transition="none";
  thumb.style.width=a.offsetWidth+"px";thumb.style.transform="translate3d("+a.offsetLeft+"px,0,0)";
  modeSwitch.classList.add("has-thumb");
  if(instant){void thumb.offsetWidth;thumb.style.transition=""}
}
function replayCards(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var cards=[].slice.call(document.querySelectorAll(".view.active .card")).filter(function(c){return c.style.display!=="none"});
  cards.forEach(function(c,i){c.style.animation="none";c.style.animationDelay=Math.min(i,8)*45+"ms"});
  void document.body.offsetWidth;
  cards.forEach(function(c){c.style.animation=""});
}

function applyFilter(){
  var v=q.value.trim().toLowerCase(),any=false;
  document.querySelectorAll(".view").forEach(function(view){
    var isActive=view.classList.contains("active");
    view.querySelectorAll(".row-section").forEach(function(r){
      var count=0;
      r.querySelectorAll(".card").forEach(function(c){var m=!v||(c.dataset.search||c.dataset.name).indexOf(v)>-1;c.style.display=m?"":"none";if(m)count++});
      r.style.display=count?"":"none";
      if(count&&isActive)any=true;
    });
  });
  document.getElementById("empty").style.display=(any||!v)?"none":"block";
}
