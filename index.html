<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #08070a;
    --panel: #131016;
    --panel-line: #221e28;
    --text: #f2f0f4;
    --text-dim: #8d8894;

    --c1: #ff3d7f;
    --c2: #29e6c9;
    --c3: #a06bff;
    --c4: #ffb545;
    --c5: #ff5f4d;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;

    background:
      radial-gradient(ellipse 600px 320px at 15% 0%, rgba(255, 61, 127, 0.10), transparent 55%),
      radial-gradient(ellipse 600px 320px at 85% 10%, rgba(41, 230, 201, 0.08), transparent 55%),
      var(--bg);

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 32px 18px 60px;

    font-family: "Inter", sans-serif;
    color: var(--text);

    overflow-x: hidden;
  }

  .marquee { width: 100%; max-width: 440px; }

  .strip { display: flex; justify-content: space-between; padding: 0 2px; margin-bottom: 16px; }

  .strip span { width: 6px; height: 6px; border-radius: 1.5px; background: var(--panel-line); }
  .strip span:nth-child(4n + 1) { background: var(--c1); box-shadow: 0 0 6px rgba(255, 61, 127, 0.6); }
  .strip span:nth-child(4n + 2) { background: var(--c2); box-shadow: 0 0 6px rgba(41, 230, 201, 0.6); }
  .strip span:nth-child(4n + 3) { background: var(--c3); box-shadow: 0 0 6px rgba(160, 107, 255, 0.6); }

  .strip span {
    animation: bulb-chase 2.6s ease-in-out infinite;
  }

  .strip span:nth-child(1) { animation-delay: 0s; }
  .strip span:nth-child(2) { animation-delay: 0.09s; }
  .strip span:nth-child(3) { animation-delay: 0.18s; }
  .strip span:nth-child(4) { animation-delay: 0.27s; }
  .strip span:nth-child(5) { animation-delay: 0.36s; }
  .strip span:nth-child(6) { animation-delay: 0.45s; }
  .strip span:nth-child(7) { animation-delay: 0.54s; }
  .strip span:nth-child(8) { animation-delay: 0.63s; }
  .strip span:nth-child(9) { animation-delay: 0.72s; }
  .strip span:nth-child(10) { animation-delay: 0.81s; }
  .strip span:nth-child(11) { animation-delay: 0.9s; }
  .strip span:nth-child(12) { animation-delay: 0.99s; }
  .strip span:nth-child(13) { animation-delay: 1.08s; }
  .strip span:nth-child(14) { animation-delay: 1.17s; }
  .strip span:nth-child(15) { animation-delay: 1.26s; }

  @keyframes bulb-chase {
    0%, 60%, 100% { opacity: 0.35; transform: scale(0.85); }
    20% { opacity: 1; transform: scale(1.15); }
  }

  h1 {
    font-family: "Bebas Neue", sans-serif;
    font-size: 48px;
    letter-spacing: 5px;
    text-align: center;
    margin: 0;

    background: linear-gradient(90deg, var(--c1), var(--c3) 45%, var(--c2) 75%, var(--c4));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter: drop-shadow(0 0 18px rgba(160, 107, 255, 0.20));

    animation: title-glow 2.4s ease-out;
  }

  @keyframes title-glow {
    0% { filter: drop-shadow(0 0 0px rgba(160, 107, 255, 0)); }
    35% { filter: drop-shadow(0 0 34px rgba(160, 107, 255, 0.55)); }
    100% { filter: drop-shadow(0 0 18px rgba(160, 107, 255, 0.20)); }
  }

  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    letter-spacing: 2.5px;
    margin: 6px 0 22px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    margin: 0 auto 10px;
    width: fit-content;

    padding: 5px 13px;
    border-radius: 20px;

    background: rgba(255, 61, 127, 0.08);
    border: 1px solid rgba(255, 61, 127, 0.25);

    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--c1);
  }

  .eyebrow-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--c1);
    box-shadow: 0 0 8px 1px rgba(255, 61, 127, 0.8);
    animation: pulse-dot 1.8s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .perf-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    margin: 0 0 22px;
  }

  .perf-divider::before,
  .perf-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--panel-line), transparent);
  }

  .perf-divider i {
    width: 4px;
    height: 4px;
    border-radius: 1px;
    background: var(--panel-line);
    display: inline-block;
  }

  .perf-divider i:nth-child(2) { background: var(--c1); opacity: 0.7; }
  .perf-divider i:nth-child(3) { background: var(--c2); opacity: 0.7; }
  .perf-divider i:nth-child(4) { background: var(--c3); opacity: 0.7; }

  /* ---------- Screen selector (tabs) ---------- */

  .selector {
    position: relative;
    display: flex;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
  }

  .selector button {
    position: relative;
    z-index: 2;

    flex: 1;
    border: none;
    background: transparent;
    cursor: pointer;

    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.4px;
    color: var(--text-dim);

    padding: 11px 0;
    border-radius: 9px;

    transition: color 0.25s ease;
  }

  .selector button.active { color: #08070a; }

  .selector .glider {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);

    border-radius: 9px;
    background: linear-gradient(120deg, var(--c2), var(--c3) 70%);

    transition: transform 0.32s cubic-bezier(.65, 0, .35, 1);
    z-index: 1;
  }

  .selector[data-active="apps"] .glider {
    transform: translateX(100%);
    background: linear-gradient(120deg, var(--c1), var(--c4) 80%);
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- Shared icon grid (used by both Websites and Apps) ---------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .app {
    --accent: var(--c1);
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;

    text-decoration: none;
    color: var(--text);

    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
  }

  .app:nth-child(6n + 1) { --accent: var(--c1); }
  .app:nth-child(6n + 2) { --accent: var(--c2); }
  .app:nth-child(6n + 3) { --accent: var(--c3); }
  .app:nth-child(6n + 4) { --accent: var(--c4); }
  .app:nth-child(6n + 5) { --accent: var(--c5); }
  .app:nth-child(6n + 6) { --accent: var(--c2); }

  .app-icon {
    width: 100%;
    aspect-ratio: 1 / 1;

    border-radius: 21px;
    background: var(--panel);
    border: 1px solid var(--panel-line);

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: "Bebas Neue", sans-serif;
    font-size: 30px;
    letter-spacing: 1px;

    position: relative;
    overflow: hidden;

    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .app-icon::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, var(--accent), transparent 70%);
    opacity: 0.22;
    transition: opacity 0.2s ease;
  }

  .app-icon span { position: relative; z-index: 1; color: var(--accent); }

  .app.live:hover .app-icon {
    border-color: var(--accent);
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 10px 26px -12px var(--accent);
  }

  .app.live:hover .app-icon::before { opacity: 0.34; }

  .app-name {
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.2px;
    line-height: 1.25;
  }

  .app.locked { cursor: default; }
  .app.locked .app-icon { opacity: 0.5; }
  .app.locked .app-icon span { color: var(--text-dim); }
  .app.locked .app-name { color: var(--text-dim); }

  .soon-tag {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1px;

    color: var(--text-dim);
    background: rgba(8, 7, 10, 0.85);
    border: 1px solid var(--panel-line);
    border-radius: 5px;
    padding: 2px 6px;

    z-index: 2;
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .footer-line {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 26px;
  }

  @media (prefers-reduced-motion: reduce) {
    .app { animation: none; opacity: 1; transform: none; }
    .selector .glider { transition: none; }
    .strip span { animation: none; opacity: 1; }
    .eyebrow-dot { animation: none; }
    h1 { animation: none; }
  }

  @media (max-width: 480px) {
    body { padding: 24px 14px 50px; }
    h1 { font-size: 42px; letter-spacing: 4px; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 11px; }
    .app-icon { font-size: 24px; border-radius: 18px; }
  }
</style>
</head>

<body>

  <div class="marquee">

    <div class="strip">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <span class="eyebrow"><span class="eyebrow-dot"></span>NOW SCREENING</span>

    <h1>MOVIE&nbsp;HUB</h1>
    <p class="subtitle">LIGHTS DOWN, PICK A SCREEN</p>

    <div class="perf-divider"><i></i><i></i><i></i><i></i></div>

    <div class="selector" id="selector" data-active="sites">
      <div class="glider"></div>
      <button type="button" class="active" data-target="sites">Websites</button>
      <button type="button" data-target="apps">Apps</button>
    </div>

    <div class="screen active" id="screen-sites">
      <div class="grid" id="reel"></div>
    </div>

    <div class="screen" id="screen-apps">
      <div class="grid" id="grid"></div>
    </div>

    <p class="footer-line" id="footerLine">TAP AN ICON TO ENTER</p>

  </div>


  <script>
    // ================================================================
    // WEBSITE LINK ADD KORTE HOLE (Websites tab):
    //
    // { name: "Website Name", url: "https://example.com/" },
    //
    // APP ADD KORTE HOLE (Apps tab):
    //
    // { name: "App Name", url: "https://example.com/" },     -> live app
    // { name: "App Name", url: null },                        -> coming soon
    //
    // Shudhu name ebong URL change korlei hobe.
    // Protita notun entry automatic color o icon pabe.
    // ================================================================

    const links = [
      { name: "Plex", url: "https://watch.plex.tv/en-GB" },
      { name: "M4UHD", url: "https://m4uhd.vip/" },
      { name: "TechVyro Movies", url: "https://techvyro-movies.onrender.com/" },
      { name: "CineHD", url: "https://cinehd.vc/" },
      { name: "NightFlix", url: "https://nightflix.vg/" },
      { name: "Pvrplay", url: "https://pvrplay.online/" },
      { name: "Nightflix", url: "https://nightflix.to/" },
      { name: "Bingr", url: "https://bingr.one/home" },
      { name: "Cinejoy", url: "https://cinejoy.pk/" },
      { name: "Cinegram", url: "https://cinegram.tv/home" },
      { name: "Watchott", url: "https://watchott.org/" },
      { name: "Moviesfree", url: "https://moviesfree.cv/" },
      { name: "1tube", url: "https://www.1tube.org/" },
      { name: "Coming Soon", url: null },
    ];

    const apps = [
      { name: "CineHD", url: "https://cinehd.dev/download/global/CineHD-v1.1.4-(Universal).apk" },
      { name: "Moviboxapk", url: "https://file.dxmaxapk.com/moviebox-4-0-02-0831-02-moviboxapk.com.apk" },
      { name: "PvrPlay", url: "https://stream.phoasy.com/app/PvrPlay.apk" },
      { name: "Hdghartv", url: "https://download.hdghartv.com.pk/HDGharTV_V2.7.apk" },
      { name: "Coming Soon", url: null },
      { name: "Coming Soon", url: null },
    ];

    const reel = document.getElementById("reel");
    const grid = document.getElementById("grid");
    const footerLine = document.getElementById("footerLine");

    function initial(name) {
      const clean = (name || "?").trim();
      return clean.charAt(0).toUpperCase();
    }

    // ---- shared renderer: builds one icon tile ----
    function renderTile(item, i) {
      const isLive = !!item.url;

      const el = document.createElement(isLive ? "a" : "div");
      el.className = "app " + (isLive ? "live" : "locked");

      if (isLive) {
        el.href = item.url;
        el.target = "_blank";
        el.rel = "noopener noreferrer";
      }

      el.style.animationDelay = (i * 0.06) + "s";

      const label = item.name || "Untitled";

      el.innerHTML = `
        <span class="app-icon">
          <span>${initial(label)}</span>
          ${isLive ? "" : '<span class="soon-tag">SOON</span>'}
        </span>
        <span class="app-name">${label}</span>
      `;

      return el;
    }

    // ---- render websites (icon grid) ----
    links.forEach((item, i) => reel.appendChild(renderTile(item, i)));

    // ---- render apps (icon grid) ----
    apps.forEach((item, i) => grid.appendChild(renderTile(item, i)));

    // ---- tab switching ----
    const selector = document.getElementById("selector");
    const screenSites = document.getElementById("screen-sites");
    const screenApps = document.getElementById("screen-apps");

    selector.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = btn.dataset.target;

        selector.dataset.active = target;
        selector.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));

        screenSites.classList.toggle("active", target === "sites");
        screenApps.classList.toggle("active", target === "apps");

        footerLine.textContent = "TAP AN ICON TO ENTER";
      });
    });
  </script>

</body>
</html>
