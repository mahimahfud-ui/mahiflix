<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

try{if(!matchMedia("(prefers-reduced-motion: reduce)").matches&&!sessionStorage.getItem("nf-intro"))document.documentElement.classList.add("intro-on")}catch(e){}
</script>
<style>
:root{--bg:#141414;--panel:#181818;--card:#242424;--text:#fff;--dim:#a7a7a7;--muted:#707070;--red:#e50914;--green:#46d369;--yellow:#f5c518;--border:#343434}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}:focus-visible{outline:2px solid #fff;outline-offset:3px}
.logo{font:400 36px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.05em;color:var(--red)}
nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:center;gap:24px;padding:15px 4%;background:linear-gradient(180deg,rgba(0,0,0,.92),transparent);transition:.3s}
nav.solid{background:rgba(20,20,20,.98);box-shadow:0 8px 30px rgba(0,0,0,.18)}nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-size:14px}nav ul a{color:#ddd}nav ul a.on,nav ul a:hover{color:#fff;font-weight:700}
.nav-tools{position:absolute;right:4%;display:flex;align-items:center;gap:8px}.search{display:flex;align-items:center;border:1px solid transparent;padding:6px 8px}.search.open{border-color:#fff;background:#090909}.search button{border:0;background:none;color:#fff;display:grid;place-items:center;padding:0}.search input{width:0;opacity:0;border:0;outline:0;background:none;color:#fff;transition:.2s}.search.open input{width:180px;opacity:1;margin-left:8px}
.hero{position:relative;min-height:76vh;display:flex;align-items:flex-end;padding:110px 4% 10vh;background:radial-gradient(ellipse at 78% 24%,rgba(229,9,20,.5),transparent 34%),linear-gradient(90deg,rgba(0,0,0,.86),rgba(0,0,0,.18) 76%),linear-gradient(0deg,var(--bg),transparent 48%),#25070a}
.hero-in{max-width:760px;width:100%;margin:0 auto;text-align:center}.hero-tag,.hero-meta,.btns{justify-content:center}.hero-tag{display:flex;align-items:center;gap:10px;color:#ddd;font-size:14px;font-weight:700}.hero-tag .mini{color:var(--red);font:400 24px "Bebas Neue";}.hero h1{font:400 clamp(64px,11vw,118px)/.9 "Bebas Neue",Impact,sans-serif;margin:12px 0 16px;letter-spacing:.015em;text-shadow:0 4px 20px rgba(0,0,0,.6)}.hero p{font-size:clamp(14px,1.7vw,19px);line-height:1.5;color:#eee;max-width:650px;margin:0 0 24px}.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);font-size:11px;font-weight:700;color:#e8e8e8}.pill.green{color:#9ef0b1}.pill.yellow{color:#ffe18a}.pill.red{color:#ff9a9f}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:4px;padding:11px 24px;font-weight:800;font-size:15px}.btn.play{background:#fff;color:#000}.btn.info{background:rgba(109,109,110,.72);color:#fff}.btn svg{width:20px;height:20px}

.mode-wrap{position:relative;z-index:15;margin:-34px 4% 28px;display:flex;flex-direction:column;align-items:center}.mode-switch{display:flex;width:max-content;max-width:100%;padding:5px;background:rgba(36,36,36,.94);border:1px solid #404040;border-radius:13px;box-shadow:0 16px 30px rgba(0,0,0,.35)}.mode{border:0;background:transparent;color:#999;padding:12px 22px;border-radius:9px;font-weight:800;font-size:13px;letter-spacing:.04em}.mode.active{background:var(--red);color:#fff}.legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.legend span{font-size:10px;color:#8f8f8f}
main{position:relative;z-index:2;padding-bottom:60px}.view{display:none}.view.active{display:block}
.row{margin:0 0 30px}.row-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 4% 10px}.row h2{margin:0;font-size:20px;font-weight:800}.row-note{font-size:11px;color:#757575}.rail{position:relative}.track{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x proximity;padding:38px 4% 62px;margin:-38px 0 -62px;scrollbar-width:none}.track::-webkit-scrollbar{display:none}.arrow{position:absolute;top:0;bottom:0;width:4%;min-width:40px;z-index:6;border:0;background:rgba(20,20,20,.55);color:#fff;font-size:34px;opacity:0;transition:.2s}.rail:hover .arrow{opacity:1}.arrow.l{left:0}.arrow.r{right:0}
.card{position:relative;cursor:pointer;flex:0 0 clamp(165px,19vw,280px);aspect-ratio:16/9;border-radius:4px;background:linear-gradient(140deg,var(--c1),var(--c2));display:grid;place-items:center;overflow:visible;scroll-snap-align:start;transition:transform .28s .08s,box-shadow .28s .08s;isolation:isolate}.card.logo-card img{position:relative;z-index:2;width:42%;max-height:65%;object-fit:contain;background:#000;padding:8px;border-radius:14px;box-shadow:0 7px 18px rgba(0,0,0,.32)}.initials{font:400 clamp(34px,5vw,58px)/1 "Bebas Neue";text-shadow:0 3px 12px rgba(0,0,0,.45)}.cap{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:26px 10px 9px;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);font-size:13px;font-weight:800}.more{position:absolute;left:0;right:0;top:100%;z-index:30;background:#181818;padding:11px 12px 13px;border-radius:0 0 5px 5px;opacity:0;pointer-events:none;box-shadow:0 18px 34px rgba(0,0,0,.65);transition:.18s}.actions{display:flex;gap:7px;margin-bottom:8px}.round{width:32px;height:32px;border:1px solid #555;border-radius:50%;background:#2a2a2a;color:#fff;display:grid;place-items:center}.round.go{background:#fff;color:#000;border-color:#fff}.round svg{width:14px;height:14px}.more b{display:block;font-size:13px;margin-bottom:4px}.more p{margin:0;color:#a8a8a8;font-size:11px;line-height:1.38}.more .lang{color:var(--green);font-weight:700;margin-top:5px}.ad{position:absolute;top:8px;right:8px;z-index:8;padding:3px 6px;border-radius:3px;background:rgba(0,0,0,.67);font-size:9px;font-weight:800}.a0{color:#9ef0b1}.a1{color:#ffe18a}.a2{color:#ff9b9f}.badge{position:absolute;top:8px;left:8px;z-index:8;background:var(--red);padding:3px 6px;border-radius:3px;font-size:9px;font-weight:900}.card.live:hover,.card.live:focus-within{transform:scale(1.28);z-index:20;box-shadow:0 20px 45px rgba(0,0,0,.7)}.card.live:hover .cap,.card.live:focus-within .cap{display:none}.card.live:hover .more,.card.live:focus-within .more{opacity:1;pointer-events:auto}
.top10 .track{padding-left:4%}.top10 .card{flex-basis:clamp(188px,23vw,320px);aspect-ratio:2/3;margin-left:clamp(54px,6.8vw,94px);overflow:visible}.top10 .num{position:absolute;right:100%;bottom:0;z-index:-1;margin-right:-14px;font:400 clamp(155px,19vw,260px)/.78 "Bebas Neue";color:#151515;-webkit-text-stroke:3px #5a5a5a;pointer-events:none}.top10 .card.logo-card img{width:50%;max-height:38%}.top10 .cap{padding-bottom:11px}
.section-divider{height:1px;background:linear-gradient(90deg,transparent,#333,transparent);margin:12px 4% 28px}.empty{text-align:center;color:#888;padding:100px 4%;display:none}
footer{text-align:center;color:#666;padding:30px 4% 44px;font-size:12px}footer .links{display:flex;justify-content:center;gap:18px;margin-bottom:11px}footer a{color:#eee}

.intro{display:none}.intro-on .intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000;cursor:pointer;transition:opacity .55s}.intro-on nav,.intro-on .hero,.intro-on .mode-wrap,.intro-on main,.intro-on footer{opacity:0}.intro-leave nav,.intro-leave .hero,.intro-leave .mode-wrap,.intro-leave main,.intro-leave footer{opacity:1}.intro-leave .intro{opacity:0;pointer-events:none}.intro .intro-logo{font:400 clamp(78px,16vw,160px)/1 "Bebas Neue";color:var(--red);letter-spacing:.04em;transform:scaleY(1.14);opacity:0;animation:rev 1.4s cubic-bezier(.2,.7,.2,1) .12s forwards;text-shadow:0 0 40px rgba(229,9,20,.25)}.intro:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(229,9,20,.38),transparent 60%);opacity:0;animation:glow 2s .1s forwards}@keyframes rev{from{opacity:0;transform:scale(1.12) scaleY(1.14);filter:blur(12px)}to{opacity:1;transform:scale(1) scaleY(1.14);filter:none}}@keyframes glow{to{opacity:1}}
@media(max-width:760px){nav{gap:12px;padding:12px 4%}nav .logo{font-size:31px}nav ul{display:none}.search.open input{width:145px}.hero{min-height:71vh;padding-bottom:8vh}.hero h1{font-size:70px}.mode-wrap{margin:-26px 4% 24px}.mode{padding:11px 15px}.arrow{display:none}.card.live:hover,.card.live:focus-within{transform:none}.card .more{display:none}.card .cap{display:block!important}.row h2{font-size:17px}.row-note{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true"><div class="intro-logo">MAHIFLIX</div></div>

<nav id="nav">
  <a class="logo" href="#top" aria-label="MahiFlix">MAHIFLIX</a>
  <ul>
    <li><a href="#top" data-nav="home" class="on">Home</a></li>
  </ul>
  <div class="nav-tools">
    <div class="search" id="search"><button id="sbtn" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><input id="q" type="search" placeholder="Search" autocomplete="off"></div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="hero-in">
    <div class="hero-tag"><span class="mini">M</span><span id="heroKind">GLOBAL STREAMING</span></div>
    <h1 id="heroTitle">Netflix</h1>
    <div class="hero-meta" id="heroMeta"></div>
    <p id="heroDesc">Global movies, series, anime and originals with one of the smoothest viewing experiences.</p>
    <div class="btns"><a class="btn play" id="heroGo" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>Visit</a><a class="btn info" href="#browse">Browse collection</a></div>
  </div>
</header>

<div class="mode-wrap" id="browse">
  <div class="mode-switch" role="tablist" aria-label="MahiFlix categories">
    <button class="mode active" data-mode="sites" role="tab" aria-selected="true">WEBSITES</button>
    <button class="mode" data-mode="apps" role="tab" aria-selected="false">APPS</button>
  </div>
  <div class="legend">
    <span>● No / minimal ads</span><span>● Some ads</span><span>● Ad-supported / heavier interruptions</span>
  </div>
</div>

<main>
  <div id="sitesView" class="view active"></div>
  <div id="appsView" class="view"></div>
  <p id="empty" class="empty">Nothing matched your search.</p>
</main>

<footer><div class="links"><a href="https://www.instagram.com/mahimahfud/" target="_blank" rel="noopener noreferrer">Instagram</a><a href="#browse">Websites</a><a href="#browse" id="footApps">Apps</a></div>MahiFlix © <span id="yr"></span></footer>

<script>
const S=[
{name:"7reel",url:"https://7reels.cc",domain:"7reels.cc",ads:2,pop:74,smooth:62,langs:72,new:true,desc:"Free movie and series streaming directory.",logoSources:["https://7reels.cc/favicon-96x96.png"]},
{name:"Plex",url:"https://watch.plex.tv/en-GB",domain:"plex.tv",ads:1,pop:96,smooth:94,langs:88,new:false,desc:"Free ad-supported movies, shows and live TV with premium options.",logoSources:[]},
{name:"M4UHD",url:"https://m4uhd.gold/",domain:"m4uhd.gold",ads:2,pop:94,smooth:60,langs:76,new:false,desc:"Large movie and TV streaming catalogue.",logoSources:[]},
{name:"CineHD",url:"https://cinehd.vc/",domain:"cinehd.vc",ads:2,pop:92,smooth:61,langs:78,new:false,desc:"Movies and series with a large free-streaming catalogue.",logoSources:["https://cinehd.vc/icon-192x192.png"]},
{name:"NightFlix",url:"https://nightflix.vg/",domain:"nightflix.vg",ads:2,pop:86,smooth:62,langs:78,new:false,desc:"Free movies and TV streaming site.",logoSources:[]},
{name:"Pvrplay",url:"https://pvrplay.online/",domain:"pvrplay.online",ads:2,pop:82,smooth:65,langs:74,new:false,desc:"Free movies and web-series streaming platform.",logoSources:[]},
{name:"Nightflix",url:"https://nightflix.to/",domain:"nightflix.to",ads:2,pop:79,smooth:63,langs:78,new:false,desc:"Free movies and TV streaming platform.",logoSources:[]},
{name:"Bingr",url:"https://bingr.one/home",domain:"bingr.one",ads:2,pop:73,smooth:56,langs:70,new:false,desc:"Movie and TV discovery/streaming platform.",logoSources:["https://bingr.one/icons/favicon-96x96.png","https://bingr.one/favicon.svg"]},
{name:"Cinejoy",url:"https://cinejoy.pk/",domain:"cinejoy.pk",ads:2,pop:68,smooth:52,langs:66,new:false,desc:"Movies, TV and short-drama streaming platform.",logoSources:[]},
{name:"Cinegram",url:"https://cinegram.tv/home",domain:"cinegram.tv",ads:1,pop:77,smooth:75,langs:76,new:false,desc:"Movies and series streaming platform.",logoSources:["https://cinegram.tv/sizes/fav-192.png"]},
{name:"Watchott",url:"https://watchott.org/",domain:"watchott.org",ads:1,pop:58,smooth:58,langs:65,new:false,desc:"Movie and TV streaming website.",logoSources:["https://watchott.org/favicon.svg"]},
{name:"1tube",url:"https://www.1tube.org/",domain:"1tube.org",ads:2,pop:84,smooth:66,langs:82,new:false,desc:"Movies, TV and other streaming content.",logoSources:["https://www.1tube.org/logo.png"]}
];

const A=[
{name:"Vega",url:"/download/app/vega",domain:"github.com",ads:0,pop:88,smooth:91,langs:92,new:true,desc:"Open-source Android media streaming app with ad-free streaming and downloads.",logoSources:["https://raw.githubusercontent.com/vega-org/vega-app/main/assets/adaptive_icon.png"]},
{name:"NetMirror",url:"/download/app/netmirror",domain:"netmiirror.app",ads:2,pop:90,smooth:66,langs:84,new:true,desc:"Android streaming app with movie and series sources.",logoSources:["https://netmiirror.app/wp-content/uploads/2026/10/cropped-NetMirror-1-192x192.webp","https://netmiirror.app/wp-content/uploads/2026/10/cropped-NetMirror-1-180x180.webp","https://netmiirror.app/wp-content/uploads/2026/10/NetMirror-2.webp"]},
{name:"CineHD",url:"/download/app/cinehd",domain:"cinehd.dev",ads:2,pop:86,smooth:60,langs:78,new:false,desc:"Android movie and series streaming app.",logoSources:["https://cinehd.vc/icon-192x192.png","https://cinehd.dev/images/favicon.ico"]},
{name:"Moviboxapk",url:"/download/app/moviboxapk",domain:"moviboxapk.com",ads:2,pop:77,smooth:63,langs:76,new:false,desc:"Android movie and series streaming app.",logoSources:["https://moviboxapk.com/wp-content/uploads/2026/06/cropped-cropped-moviebox-icon-192x192.webp","https://moviboxapk.com/wp-content/uploads/2026/06/cropped-cropped-moviebox-icon-180x180.webp"]},
{name:"PvrPlay",url:"/download/app/pvrplay",domain:"pvrplay.online",ads:2,pop:75,smooth:64,langs:74,new:false,desc:"Android app for movies and web series.",logoSources:[]},
{name:"Hdghartv",url:"/download/app/hdghartv",domain:"hdghartv.com.pk",ads:0,pop:72,smooth:86,langs:70,new:false,desc:"Free Android movies and TV app; its site advertises an ad-free experience.",logoSources:[]},
{name:"Anivortex",url:"/download/app/anivortex",domain:"anivortex.in",ads:1,pop:70,smooth:72,langs:80,new:false,desc:"Anime-focused streaming app.",logoSources:["https://anivortex.in/images/anivortex_logo.webp","https://anivortex.in/images/anivortex_logo_transparent.webp"]},
{name:"Nxsha",url:"/download/app/nxsha",domain:"nxsha.app",ads:1,pop:74,smooth:84,langs:90,new:false,desc:"Movies, TV, anime and K-drama discovery app.",logoSources:["https://nxsha.app/favicon.ico"]}
];

const adLabel=["No / minimal ads","Some ads","More / heavier ads"];
const adClass=["a0","a1","a2"];

const clean=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.replace(/[^a-z0-9 ]/gi,"").split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase();
const hue=n=>{let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h};

function logoHTML(it){
  const sources=[...(it.logoSources||[]),
    "https://www.google.com/s2/favicons?sz=256&domain="+encodeURIComponent(it.domain),
    "https://icons.duckduckgo.com/ip3/"+encodeURIComponent(it.domain)+".ico"
  ];
  const fallback=initials(it.name);
  const first=sources[0], second=sources[1], third=sources[2];
  return "<img loading='lazy' alt='"+clean(it.name)+" logo' src='"+first+"' "+
    "onerror=\"this.onerror=null;this.src='"+second+"';this.onerror=function(){this.onerror=null;this.src='"+third+"';this.onerror=function(){this.outerHTML='<span class=initials>"+fallback+"</span>'}}\">";
}

function linkOf(it){return it.url}

function qualityScore(it){
  return (it.pop*.42)+(it.smooth*.30)+(it.langs*.18)+((2-it.ads)*10);
}

const top10=[...S].sort((a,b)=>qualityScore(b)-qualityScore(a)).slice(0,10);

function bucket(arr,n){
  return arr.filter(x=>x.ads===n).sort((a,b)=>qualityScore(b)-qualityScore(a));
}

function card(it,i,isTop){
  const c1=it.color||("hsl("+hue(it.name)+" 55% 34%)");
  const c2="#0d0d0d";
  const num=isTop?"<span class='num'>"+(i+1)+"</span>":"";
  const nw=it.new?"<span class='badge'>NEW</span>":"";
  const ad=it.ads<2?"<span class='ad "+adClass[it.ads]+"'>"+(it.ads===0?"NO AD":"LESS AD")+"</span>":"";
  const url=linkOf(it);
  return "<div class='card logo-card' style='--c1:"+c1+";--c2:"+c2+"' data-name='"+clean(it.name.toLowerCase())+"'>"+
    num+logoHTML(it)+nw+ad+
    "<a class='cap' href='"+url+"' target='_blank' rel='noopener noreferrer'>"+clean(it.name)+(it.kind==="app"?" · App":"")+"</a>"+
    "<div class='more'><div class='actions'><a class='round go' href='"+url+"' target='_blank' rel='noopener noreferrer' aria-label='Open "+clean(it.name)+"'>"+svgPlay()+"</a><button class='round fav' aria-label='Add to My List'>"+svgPlus()+"</button></div>"+
    "<b>"+clean(it.name)+"</b><p>"+clean(it.desc)+"</p><p class='lang'>"+clean(it.langs)+"</p></div></div>";
}

function rowHTML(title,items,opts){
  if(!items.length)return "";
  const top=opts&&opts.top,note=opts&&opts.note?opts.note:"";
  return "<section class='row "+(top?"top10 ":"")+"row-section' data-row='"+clean(title.toLowerCase())+"'><div class='row-head'><h2>"+clean(title)+"</h2><span class='row-note'>"+clean(note)+"</span></div><div class='rail'><button class='arrow l' aria-label='Scroll left'>&#8249;</button><div class='track'>"+items.map((it,i)=>card(Object.assign({},it,{kind:opts&&opts.kind||it.kind}),i,top)).join("")+"</div><button class='arrow r' aria-label='Scroll right'>&#8250;</button></div></div></section>";
}

function renderView(type){
  const el=document.getElementById(type==="sites"?"sitesView":"appsView");
  const data=type==="sites"?S:A;
  const label=type==="sites"?"Websites":"Apps";
  const sorted=data.slice().sort((a,b)=>qualityScore(b)-qualityScore(a));
  el.innerHTML=rowHTML(label,sorted,{kind:type==="sites"?"site":"app",note:"Your curated MahiFlix collection"});
}

renderView("sites");
renderView("apps");
function svgPlay(){return "<svg viewBox='0 0 24 24' fill='currentColor'><path d='M6 4l14 8-14 8z'/></svg>"}
function svgPlus(){return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round'><path d='M12 5v14M5 12h14'/></svg>"}
function rowHTML(title,items,opts){
  if(!items.length)return "";
  var top=opts&&opts.top;
  var note=opts&&opts.note?opts.note:"";
  return "<section class='row "+(top?"top10 ":"")+"row-section' data-row='"+clean(title.toLowerCase())+"'><div class='row-head'><h2>"+clean(title)+"</h2><span class='row-note'>"+clean(note)+"</span></div><div class='rail'><button class='arrow l' aria-label='Scroll left'>&#8249;</button><div class='track'>"+items.map(function(it,i){return card(it,i,top)}).join("")+"</div><button class='arrow r' aria-label='Scroll right'>&#8250;</button></div></section>";
}

function setHero(type){
  var featured=type==="sites"?top10[0]:A.slice().sort(function(a,b){return b.score-a.score})[0];
  document.getElementById("heroKind").textContent=type==="sites"?"GLOBAL STREAMING":"MOBILE APPS";
  document.getElementById("heroTitle").textContent=featured.name;
  document.getElementById("heroDesc").textContent=featured.desc;
  document.getElementById("heroGo").href=linkOf(featured);
  document.getElementById("heroMeta").innerHTML="<span class='pill green'>"+adLabel[featured.ads]+"</span><span class='pill'>"+clean(featured.langs)+"</span><span class='pill'>Top experience pick</span>";
}
setHero("sites");

document.querySelectorAll(".mode").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".mode").forEach(function(x){x.classList.remove("active");x.setAttribute("aria-selected","false")});
    btn.classList.add("active");btn.setAttribute("aria-selected","true");
    var mode=btn.dataset.mode;
    document.getElementById("sitesView").classList.toggle("active",mode==="sites");
    document.getElementById("appsView").classList.toggle("active",mode==="apps");
    setHero(mode);
    document.getElementById("q").value="";
    document.getElementById("empty").style.display="none";
    document.getElementById("footApps").textContent=mode==="sites"?"Apps":"Websites";
  });
});

document.querySelectorAll(".rail").forEach(function(r){
  var t=r.querySelector(".track");
  r.querySelector(".l").onclick=function(){t.scrollBy({left:-t.clientWidth*.82,behavior:"smooth"})};
  r.querySelector(".r").onclick=function(){t.scrollBy({left:t.clientWidth*.82,behavior:"smooth"})};
});
document.addEventListener("click",function(e){
  var f=e.target.closest(".fav");
  if(f){
    var on=f.dataset.on==="1";
    f.dataset.on=on?"":"1";
    f.innerHTML=on?svgPlus():"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5 9-10'/></svg>";
    return;
  }
  var cardEl=e.target.closest(".card");
  if(cardEl && !e.target.closest("a,button")){
    var name=cardEl.dataset.name||"";
    var current=(document.querySelector(".view.active")===document.getElementById("appsView"))?A:S;
    var item=current.find(function(x){return x.name.toLowerCase()===name;});
    if(item && item.url)window.open(item.url,"_blank","noopener,noreferrer");
  }
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter" && e.key!==" ")return;
  var cardEl=e.target.closest(".card");
  if(!cardEl || e.target.closest("a,button"))return;
  e.preventDefault();
  var name=cardEl.dataset.name||"";
  var current=(document.querySelector(".view.active")===document.getElementById("appsView"))?A:S;
  var item=current.find(function(x){return x.name.toLowerCase()===name;});
  if(item && item.url)window.open(item.url,"_blank","noopener,noreferrer");
});

var sb=document.getElementById("search"),q=document.getElementById("q");
document.getElementById("sbtn").onclick=function(){sb.classList.toggle("open");if(sb.classList.contains("open"))q.focus()};
q.addEventListener("input",function(){
  var v=q.value.trim().toLowerCase(),active=document.querySelector(".view.active"),any=false;
  active.querySelectorAll(".row-section").forEach(function(r){
    var count=0;
    r.querySelectorAll(".card").forEach(function(c){var m=!v||c.dataset.name.indexOf(v)>-1;c.style.display=m?"":"none";if(m)count++});
    r.style.display=count?"":"none";if(count)any=true;
  });
  document.getElementById("empty").style.display=any?"none":"block";
});

var nav=document.getElementById("nav");
addEventListener("scroll",function(){nav.classList.toggle("solid",scrollY>40)},{passive:true});
document.getElementById("yr").textContent=new Date().getFullYear();
document.getElementById("footApps").onclick=function(){document.querySelector(".mode[data-mode='apps']").click()};

(function(){
  var d=document.documentElement;
  if(!d.classList.contains("intro-on"))return;
  var done=false;
  function end(){if(done)return;done=true;try{sessionStorage.setItem("nf-intro","1")}catch(e){}d.classList.add("intro-leave");setTimeout(function(){d.classList.remove("intro-on","intro-leave")},650)}
  document.getElementById("intro").addEventListener("click",end);setTimeout(end,2600)
})();
</script>
</body>
</html>
