<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MahiFlix</title>
<meta name="description" content="Unlocking the Universe of Movies & Web Series">
<meta property="og:title" content="MahiFlix">
<meta property="og:description" content="Unlocking the Universe of Movies & Web Series">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  /* ================================================================
     FIRST-PAINT INTRO DECISION
     ================================================================ */

  try {
    if (
      !matchMedia("(prefers-reduced-motion: reduce)").matches &&
      !sessionStorage.getItem("nf-intro")
    ) {
      document.documentElement.classList.add("intro-on");
    }
  } catch (e) {}
</script>

<style>
  :root {
    --bg: #070707;
    --surface: #141414;
    --line: #262626;
    --text: #f5f5f1;
    --dim: #8c8c8c;
    --red: #e50914;
    --red-deep: #8f0710;
  }

  * {
    box-sizing: border-box;
  }

  html {
    background: var(--bg);
  }

  body {
    margin: 0;
    min-height: 100vh;

    background:
      radial-gradient(
        ellipse 900px 380px at 50% -80px,
        rgba(229, 9, 20, .22),
        transparent 70%
      ),
      var(--bg);

    color: var(--text);

    font-family:
      "Inter",
      system-ui,
      sans-serif;

    padding:
      44px 20px 70px;

    overflow-x: hidden;
  }

  main {
    max-width: 1040px;
    margin: 0 auto;
  }

  /* ================================================================
     WORDMARK
     ================================================================ */

  .brand {
    text-align: center;
    margin: 0;
    line-height: 1;
  }

  .wordmark {
    display: inline-block;

    font-family:
      "Bebas Neue",
      Impact,
      sans-serif;

    font-size:
      clamp(54px, 13vw, 128px);

    letter-spacing: .03em;

    transform:
      scaleY(1.18);

    transform-origin:
      center top;

    margin-bottom: .16em;

    background:
      linear-gradient(
        180deg,
        #ff2d37 0%,
        var(--red) 45%,
        var(--red-deep) 100%
      );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    filter:
      drop-shadow(
        0 8px 22px rgba(229, 9, 20, .35)
      );
  }

  .wordmark b {
    font-weight: 400;
    font-size: 1.08em;
  }

  .tagline {
    margin: 2px 0 0;

    text-align: center;

    white-space: nowrap;

    font-size:
      clamp(10px, 3.7vw, 21px);

    font-weight: 500;

    letter-spacing: .01em;

    line-height: 1.4;

    color: #e5242f;
  }

  /* ================================================================
     INSTAGRAM ICON
     ================================================================ */

  .credit {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 12px;
  }

  .credit a {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    width: 34px;
    height: 34px;

    color: #fff;

    text-decoration: none;

    border-radius: 10px;

    transition:
      transform .22s ease,
      filter .22s ease,
      opacity .22s ease;
  }

  .credit a:hover,
  .credit a:focus-visible {
    transform: scale(1.12);

    filter:
      brightness(1.15)
      drop-shadow(
        0 0 10px rgba(229, 9, 20, .32)
      );
  }

  .credit a:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 4px;
  }

  .credit svg {
    width: 23px;
    height: 23px;
    display: block;
  }

  /* ================================================================
     TABS
     ================================================================ */

  .tabs {
    display: flex;
    gap: 6px;

    width: fit-content;

    margin:
      30px auto 38px;

    padding: 5px;

    background: var(--surface);

    border:
      1px solid var(--line);

    border-radius: 14px;
  }

  .tab {
    display: inline-flex;

    align-items: center;

    gap: 9px;

    border: 0;

    background: transparent;

    color: var(--dim);

    font:
      600 14px
      "Inter",
      sans-serif;

    padding:
      11px 22px;

    border-radius: 10px;

    cursor: pointer;

    transition:
      background .25s,
      color .25s;
  }

  .tab svg {
    width: 17px;
    height: 17px;
  }

  .tab:hover {
    color: var(--text);
  }

  .tab[aria-selected="true"] {
    background: var(--red);
    color: #fff;
  }

  .tab:focus-visible,
  .tile:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  /* ================================================================
     GRID
     ================================================================ */

  .grid {
    display: grid;

    gap:
      34px 22px;

    grid-template-columns:
      repeat(
        auto-fill,
        minmax(150px, 1fr)
      );
  }

  .grid[hidden] {
    display: none;
  }

  .tile {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;

    text-decoration: none;

    color: var(--dim);

    transition:
      transform .3s ease,
      color .3s ease;
  }

  /* ================================================================
     AVATAR
     ================================================================ */

  .avatar {
    position: relative;

    width: 100%;

    aspect-ratio: 1;

    border-radius: 18px;

    overflow: hidden;

    display: grid;

    place-items: center;

    background: var(--c1);

    box-shadow:
      0 10px 24px -14px rgba(0,0,0,.9);

    transition:
      transform .3s ease,
      box-shadow .3s ease;
  }

  .avatar::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.18),
        rgba(0,0,0,.18)
      );

    pointer-events: none;

    z-index: 5;
  }

  .tile.site .avatar {
    background:
      linear-gradient(
        150deg,
        var(--c1),
        var(--c2)
      );
  }

  /* ================================================================
     REAL WEBSITE LOGOS
     ================================================================ */

  .tile .avatar img.site-logo {
    width: 58%;
    height: 58%;

    object-fit: contain;

    position: relative;

    z-index: 2;

    background: #000;

    padding: 9%;

    border-radius: 22%;

    box-shadow:
      0 6px 16px -4px rgba(0,0,0,.45);
  }

  .initials {
    position: relative;

    z-index: 2;

    color: #fff;

    font:
      400 clamp(40px, 7vw, 58px)
      "Bebas Neue",
      sans-serif;

    letter-spacing: 1px;

    text-shadow:
      0 2px 10px rgba(0,0,0,.3);
  }

  /* ================================================================
     APPS
     ================================================================ */

  .tile.app .avatar {
    border-radius: 18px;
    background: var(--surface);
    box-shadow:
      0 10px 24px -14px rgba(0,0,0,.9),
      0 0 0 1px rgba(255,255,255,.05);
  }

  .tile.app .avatar > svg {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    overflow: visible;
  }

  .animated-app-avatar {
    transform-origin: center;

    will-change:
      transform;
  }

  .app-character-motion {
    transform-box: fill-box;

    transform-origin: center;

    animation:
      appFloat 3.2s ease-in-out infinite;
  }

  .app-background-motion {
    transform-box: fill-box;

    transform-origin: center;

    animation:
      appRotate 7s ease-in-out infinite;
  }

  .app-face-pulse {
    transform-box: fill-box;

    transform-origin: center;

    animation:
      appPulse 2.6s ease-in-out infinite;
  }

  .app-float-a {
    transform-box: fill-box;

    transform-origin: center;

    animation:
      appFloatA 3.8s ease-in-out infinite;
  }

  .app-float-b {
    transform-box: fill-box;

    transform-origin: center;

    animation:
      appFloatB 4.4s ease-in-out infinite;
  }

  .app-spin {
    transform-box: fill-box;

    transform-origin: center;

    animation:
      appSpin 6s linear infinite;
  }

  .app-pulse {
    transform-box: fill-box;

    transform-origin: center;

    animation:
      appGlow 2.4s ease-in-out infinite;
  }

  .app-blink {
    transform-box: fill-box;
    transform-origin: center;
    animation: appBlink 5.2s ease-in-out infinite;
  }

  @keyframes appBlink {
    0%, 42%, 46%, 100% { transform: scaleY(1); }
    44% { transform: scaleY(.08); }
  }

  @keyframes appFloat {

    0%, 100% {
      transform:
        translateY(0)
        rotate(-2deg)
        scale(1);
    }

    50% {
      transform:
        translateY(-5px)
        rotate(2deg)
        scale(1.035);
    }
  }

  @keyframes appRotate {

    0%, 100% {
      transform:
        translate(0, 0)
        rotate(0deg);
    }

    50% {
      transform:
        translate(2px, -2px)
        rotate(4deg);
    }
  }

  @keyframes appPulse {

    0%, 100% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.055);
    }
  }

  @keyframes appFloatA {

    0%, 100% {
      transform:
        translate(0, 0)
        scale(1);
    }

    50% {
      transform:
        translate(4px, -5px)
        scale(1.12);
    }
  }

  @keyframes appFloatB {

    0%, 100% {
      transform:
        translate(0, 0)
        scale(1);
    }

    50% {
      transform:
        translate(-4px, 4px)
        scale(.9);
    }
  }

  @keyframes appSpin {

    from {
      transform:
        rotate(0deg);
    }

    to {
      transform:
        rotate(360deg);
    }
  }

  @keyframes appGlow {

    0%, 100% {
      transform: scale(1);
      opacity: .75;
    }

    50% {
      transform:
        scale(1.2);

      opacity: 1;
    }
  }

  /* ================================================================
     NAME
     ================================================================ */

  .name {
    font-size: 14px;

    font-weight: 600;

    text-align: center;

    line-height: 1.3;

    overflow-wrap: anywhere;
  }

  a.tile:hover,
  a.tile:focus-visible {
    transform:
      translateY(-6px);

    color: #fff;
  }

  a.tile:hover .avatar,
  a.tile:focus-visible .avatar {
    transform:
      scale(1.05);

    box-shadow:
      0 18px 34px -12px var(--c1),
      0 0 0 1px rgba(255,255,255,.14);
  }

  /* ================================================================
     COMING SOON
     ================================================================ */

  .tile.soon {
    cursor: default;
  }

  .tile.soon .avatar {
    background: var(--surface);

    border:
      1px dashed #3a3a3a;

    box-shadow: none;
  }

  .tile.soon .avatar::after {
    display: none;
  }

  .tile.soon .initials {
    color: #4a4a4a;
  }

  .tile.soon .name {
    color: #5d5d5d;
  }

  .badge {
    position: absolute;

    z-index: 8;

    bottom: 9px;

    left: 50%;

    transform:
      translateX(-50%);

    font-size: 10px;

    font-weight: 600;

    letter-spacing: .04em;

    white-space: nowrap;

    color: var(--dim);

    background: #0c0c0c;

    border:
      1px solid var(--line);

    padding:
      3px 8px;

    border-radius: 6px;
  }

  /* ================================================================
     CINEMATIC INTRO
     ================================================================ */

  .intro {
    display: none;
  }

  .intro-on .intro {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: grid;

    place-content: center;

    justify-items: center;

    background: #000;

    overflow: hidden;

    cursor: pointer;

    transition:
      opacity .5s ease;
  }

  .intro-on main {
    opacity: 0;
  }

  main {
    transition:
      opacity .7s ease;
  }

  .intro-leave main {
    opacity: 1;
  }

  .intro-leave .intro {
    opacity: 0;

    pointer-events: none;
  }

  .intro::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 120vmax;
    height: 60vmax;

    transform:
      translate(-50%, -50%);

    background:
      radial-gradient(
        ellipse at center,
        rgba(229,9,20,.38),
        rgba(229,9,20,.08) 35%,
        transparent 62%
      );

    opacity: 0;

    animation:
      glow 2.2s ease-out .15s forwards;
  }

  .intro::after {
    content: "";

    position: absolute;

    inset: -50%;

    background-image:
      radial-gradient(
        rgba(255,255,255,.35) 1px,
        transparent 1.4px
      ),
      radial-gradient(
        rgba(229,9,20,.4) 1px,
        transparent 1.4px
      );

    background-size:
      90px 90px,
      140px 140px;

    background-position:
      0 0,
      40px 60px;

    opacity: 0;

    animation:
      dust 2.4s linear forwards;
  }

  .intro-mark {
    position: relative;

    z-index: 1;

    opacity: 0;

    animation:
      reveal
      1.5s
      cubic-bezier(.2,.7,.2,1)
      .15s
      forwards;
  }

  .intro .wordmark {
    margin: 0;

    background:
      linear-gradient(
        100deg,
        transparent 42%,
        rgba(255,255,255,.85) 50%,
        transparent 58%
      ) 160% 0 / 250% 100% no-repeat,

      linear-gradient(
        180deg,
        #ff2d37 0%,
        var(--red) 45%,
        var(--red-deep) 100%
      );

    -webkit-background-clip: text;
    background-clip: text;

    animation:
      sweep
      1.1s
      ease-in-out
      1.25s
      forwards;
  }

  .intro .tagline {
    position: relative;

    z-index: 1;

    margin-top: 14px;

    opacity: 0;

    animation:
      rise
      .8s
      ease
      1.45s
      forwards;
  }

    @keyframes glow {
    to {
      opacity: 1;
    }
  }

  @keyframes dust {

    0% {
      opacity: 0;

      transform:
        translateY(0);
    }

    30% {
      opacity: .35;
    }

    100% {
      opacity: 0;

      transform:
        translateY(-60px);
    }
  }

  @keyframes reveal {

    0% {
      opacity: 0;

      transform:
        scale(1.14);

      filter:
        blur(14px);
    }

    100% {
      opacity: 1;

      transform:
        scale(1);

      filter:
        blur(0);
    }
  }

  @keyframes sweep {

    to {
      background-position:
        -60% 0,
        0 0;
    }
  }

  @keyframes rise {

    from {
      opacity: 0;

      transform:
        translateY(8px);
    }

    to {
      opacity: 1;

      transform:
        none;
    }
  }

  /* ================================================================
     RESPONSIVE
     ================================================================ */

  @media (max-width: 560px) {

    body {
      padding-top: 32px;
    }

    .grid {
      grid-template-columns:
        repeat(3, 1fr);

      gap:
        26px 14px;
    }

    .avatar {
      border-radius: 16px;
    }

    .name {
      font-size: 12.5px;
    }

    .badge {
      font-size: 8.5px;

      padding:
        2px 5px;

      bottom: 6px;
    }

    .tab {
      padding:
        10px 18px;
    }
  }

  @media (max-width: 360px) {

    .grid {
      grid-template-columns:
        repeat(2, 1fr);
    }
  }

  @media (prefers-reduced-motion: reduce) {

    * {
      transition: none !important;
    }

    .intro {
      display: none !important;
    }

    .intro-on main {
      opacity: 1;
    }

    .app-character-motion,
    .app-background-motion,
    .app-face-pulse,
    .app-float-a,
    .app-float-b,
    .app-spin,
    .app-pulse {
      animation: none !important;
    }
  }
</style>
</head>

const SVGNS =
  "http://www.w3.org/2000/svg";


function hash(str) {

  let h = 2166136261;

  for (
    let i = 0;
    i < str.length;
    i++
  ) {

    h ^=
      str.charCodeAt(i);

    h =
      Math.imul(
        h,
        16777619
      );
  }

  return h >>> 0;
}


function getColorFromString(str) {

  const h =
    hash(str);

  const hue =
    h % 360;

  return {

    c1:
      `hsl(${hue} 68% 44%)`,

    c2:
      `hsl(${(hue + 38) % 360} 70% 32%)`,

    hue
  };
}


function hostOf(url) {

  try {

    return new URL(url)
      .hostname
      .replace(
        /^www\./,
        ""
      );

  } catch {

    return "";
  }
}


function nameFromUrl(url) {

  const parts =
    hostOf(url)
      .split(".");

  const core =
    parts.length > 1
      ? parts[parts.length - 2]
      : parts[0] || "Untitled";

  return (
    core.charAt(0).toUpperCase() +
    core.slice(1)
  );
}


function normalize(entry) {

  if (
    typeof entry === "string"
  ) {

    return {

      name:
        nameFromUrl(entry),

      url:
        entry
    };
  }


  return {

    name:
      entry.name ||
      (
        entry.url
          ? nameFromUrl(entry.url)
          : "Coming Soon"
      ),

    url:
      entry.url || null
  };
}


function initialsOf(name) {

  const words =
    name
      .replace(
        /[^\p{L}\p{N}\s]/gu,
        ""
      )
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if (
    !words.length
  ) {
    return "?";
  }


  return (
    words.length > 1

      ? words[0][0] +
        words[1][0]

      : words[0].slice(0, 2)

  ).toUpperCase();
}


function el(
  tag,
  cls,
  text
) {

  const n =
    document.createElement(
      tag
    );

  if (cls) {
    n.className =
      cls;
  }

  if (
    text !== undefined
  ) {
    n.textContent =
      text;
  }

  return n;
}


/* ================================================================
   WEBSITE LOGO FETCHER
   ================================================================ */

function loadRealLogo(
  avatar,
  item,
  fallbackElement
) {

  const host =
    hostOf(item.url);


  if (!host) {

    fallbackElement();

    return;
  }


  const encodedHost =
    encodeURIComponent(host);


  const directLogoHosts = new Set([
    "techvyro-movies.onrender.com",
    "moviesfree.cv",
    "netout.pages.dev"
  ]);

  const specificDirectLogos = {
    "techvyro-movies.onrender.com": [
      "https://techvyro-movies.onrender.com/apple-icon.png",
      "https://techvyro-movies.onrender.com/icon.svg"
    ],
    "moviesfree.cv": [
      "https://moviesfree.cv/img/icon.png"
    ],
    "netout.pages.dev": [
      "https://netout.pages.dev/icons/pwa512.png"
    ],
    "1tube.org": [
      "https://www.1tube.org/logo.png"
    ],
    "watchott.org": [
      "https://watchott.org/favicon.svg"
    ],
    "cinegram.tv": [
      "https://cinegram.tv/sizes/fav-192.png"
    ],
    "bingr.one": [
      "https://bingr.one/icons/favicon-96x96.png",
      "https://bingr.one/favicon.svg"
    ],
    "cinehd.vc": [
      "https://cinehd.vc/icon-192x192.png"
    ],
    "7reels.cc": [
      "https://7reels.cc/favicon-96x96.png"
    ]
  };

  const sources = [

    /*
      Direct site logos — prioritized for sites
      with known high-resolution icon endpoints.
    */
    ...(specificDirectLogos[host] || []),

    /*
      Direct DuckDuckGo & Google favicon for directLogoHosts —
      DuckDuckGo prioritized to avoid Google 16px fallback globe.
    */
    ...(directLogoHosts.has(host)
      ? [
          `https://icons.duckduckgo.com/ip3/${encodedHost}.ico`,
          `https://www.google.com/s2/favicons?sz=256&domain=${encodedHost}`
        ]
      : []),

    /*
      Primary:
      Google favicon
    */
    `https://www.google.com/s2/favicons?sz=128&domain=${encodedHost}`,

    /*
      Secondary:
      DuckDuckGo
    */
    `https://icons.duckduckgo.com/ip3/${encodedHost}.ico`,

    /*
      Official site icons
    */
    `https://${host}/apple-touch-icon.png`,
    `https://${host}/apple-touch-icon-precomposed.png`,
    `https://${host}/favicon.png`,
    `https://${host}/favicon.ico`,

    /*
      Final large Google fallback
    */
    `https://www.google.com/s2/favicons?sz=256&domain=${encodedHost}`

  ];


  let finished =
    false;


  function tryNext(i) {

    if (
      finished ||
      i >= sources.length
    ) {

      fallbackElement();

      return;
    }


    const img =
      new Image();


    img.alt =
      "";


    img.decoding =
      "async";


    img.referrerPolicy =
      "no-referrer";


    img.onload = () => {

      if (
        !img.naturalWidth ||
        !img.naturalHeight ||
        (img.src.includes("google.com/s2/favicons") && img.naturalWidth <= 16 && img.naturalHeight <= 16)
      ) {

        tryNext(i + 1);

        return;
      }


      finished =
        true;


      img.className =
        "site-logo";


      avatar.replaceChildren(
        img
      );
    };


    img.onerror = () => {

      tryNext(
        i + 1
      );

    };


    img.src =
      sources[i];
  }


  tryNext(0);
}


/* ================================================================
   WEBSITE AVATAR
   ================================================================ */

function websiteAvatar(
  item,
  active,
  idx
) {

  const avatar =
    el(
      "span",
      "avatar"
    );


  const colors =
    getColorFromString(
      active

        ? item.name +
          hostOf(item.url)

        : "soon" + idx
    );


  avatar.style.setProperty(
    "--c1",
    colors.c1
  );


  avatar.style.setProperty(
    "--c2",
    colors.c2
  );


  const fallback = () => {

    if (
      !avatar.querySelector(
        "img"
      )
    ) {

      avatar.replaceChildren(
        el(
          "span",
          "initials",
          initialsOf(
            item.name
          )
        )
      );
    }
  };


  if (!active) {

    fallback();

    return avatar;
  }


  fallback();


  loadRealLogo(
    avatar,
    item,
    fallback
  );


  return avatar;
}

/* ================================================================
   APP REAL LOGO LOADER
   ================================================================ */

function loadRealAppLogo(
  avatar,
  item,
  fallbackElement
) {

  const appDirectLogos = {
    "NetMirror": [
      "https://netmiirror.app/wp-content/uploads/2026/10/cropped-NetMirror-1-192x192.webp",
      "https://netmiirror.app/wp-content/uploads/2026/10/cropped-NetMirror-1-180x180.webp",
      "https://netmiirror.app/wp-content/uploads/2026/10/NetMirror-2.webp",
      "https://netmiirror.app/wp-content/uploads/2026/10/cropped-NetMirror-1-32x32.webp",
      "https://www.google.com/s2/favicons?sz=128&domain=netmiirror.app",
      "https://icons.duckduckgo.com/ip3/netmiirror.app.ico"
    ],
    "CineHD": [
      "https://cinehd.vc/icon-192x192.png",
      "https://cinehd.dev/images/favicon.ico",
      "https://www.google.com/s2/favicons?sz=128&domain=cinehd.vc",
      "https://www.google.com/s2/favicons?sz=128&domain=cinehd.dev"
    ],
    "Moviboxapk": [
      "https://moviboxapk.com/wp-content/uploads/2026/06/cropped-cropped-moviebox-icon-192x192.webp",
      "https://moviboxapk.com/wp-content/uploads/2026/06/cropped-cropped-moviebox-icon-180x180.webp",
      "https://dxmaxapk.com/wp-content/uploads/2025/10/cropped-dixmax-favicon-192x192.webp",
      "https://icons.duckduckgo.com/ip3/moviboxapk.com.ico",
      "https://www.google.com/s2/favicons?sz=128&domain=moviboxapk.com"
    ],
    "PvrPlay": [
      "https://www.google.com/s2/favicons?sz=128&domain=pvrplay.online",
      "https://icons.duckduckgo.com/ip3/pvrplay.online.ico",
      "https://pvrplay.online/apple-touch-icon.png"
    ],
    "Hdghartv": [
      "https://www.google.com/s2/favicons?sz=128&domain=hdghartv.com.pk",
      "https://icons.duckduckgo.com/ip3/hdghartv.com.pk.ico",
      "https://hdghartv.com.pk/favicon.ico"
    ],
    "Anivortex": [
      "https://anivortex.in/images/anivortex_logo.webp",
      "https://anivortex.in/images/anivortex_logo_transparent.webp",
      "https://www.google.com/s2/favicons?sz=128&domain=anivortex.in",
      "https://icons.duckduckgo.com/ip3/anivortex.in.ico"
    ],
    "Nxsha": [
      NXSHA_ICON,
      "nxsha_icon.png",
      "./nxsha_icon.png"
    ]
  };

  const host = hostOf(item.url);
  const encodedHost = host ? encodeURIComponent(host) : "";

  const sources = [
    ...(appDirectLogos[item.name] || []),
    ...(encodedHost ? [
      `https://www.google.com/s2/favicons?sz=128&domain=${encodedHost}`,
      `https://icons.duckduckgo.com/ip3/${encodedHost}.ico`
    ] : [])
  ];

  let finished = false;

  function tryNext(i) {
    if (finished || i >= sources.length) {
      fallbackElement();
      return;
    }

    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";

    img.onload = () => {
      if (
        !img.naturalWidth ||
        !img.naturalHeight ||
        (img.src.includes("google.com/s2/favicons") && img.naturalWidth <= 16 && img.naturalHeight <= 16)
      ) {
        tryNext(i + 1);
        return;
      }

      finished = true;
      img.className = "site-logo";
      avatar.replaceChildren(img);
    };

    img.onerror = () => {
      tryNext(i + 1);
    };

    img.src = sources[i];
  }

  tryNext(0);
}

/* ================================================================
   APP AVATAR
   ================================================================ */

function appAvatar(
  item,
  active,
  idx
) {

  const avatar =
    el(
      "span",
      "avatar"
    );


  const colors =
    getColorFromString(
      active
        ? item.name + hostOf(item.url)
        : "soon" + idx
    );


  avatar.style.setProperty(
    "--c1",
    colors.c1
  );

  avatar.style.setProperty(
    "--c2",
    colors.c2
  );


  const fallback = () => {
    if (!avatar.querySelector("img")) {
      avatar.replaceChildren(
        active
          ? cartoonAvatar(item.name + hostOf(item.url))
          : el("span", "initials", "?")
      );
    }
  };


  if (!active) {
    fallback();
    return avatar;
  }

  fallback();

  loadRealAppLogo(
    avatar,
    item,
    fallback
  );

  return avatar;
}

function renderGrid(

  const frag =

  list
    .map(normalize)
    .forEach(
      (item, idx) => {

        const active =
          !!item.url;


        const tile =
          el(
            active
              ? "a"
              : "div",

            `tile ${kind} ${
              active
                ? ""
                : "soon"
            }`.trim()
          );


        if (active) {

          tile.href =
            item.url;

          tile.target =
            "_blank";

          tile.rel =
            "noopener noreferrer";

          tile.setAttribute(
            "aria-label",
            item.name
          );

          if (kind === "app") {
            tile.setAttribute(
              "download",
              `${item.name}.apk`
            );

            tile.setAttribute(
              "type",
              "application/vnd.android.package-archive"
            );

            tile.addEventListener("click", (e) => {
              if (window.self !== window.top) {
                try {
                  const dl = document.createElement("a");
                  dl.href = item.url;
                  dl.target = "_blank";
                  dl.rel = "noopener noreferrer";
                  dl.setAttribute("download", `${item.name}.apk`);
                  document.body.appendChild(dl);
                  dl.click();
                  document.body.removeChild(dl);
                  e.preventDefault();
                } catch (_) {}
              }
            });
          }

        } else {

          tile.setAttribute(
            "aria-disabled",
            "true"
          );

        }


        const avatar =
          kind === "site"

            ? websiteAvatar(
                item,
                active,
                idx
              )

            : appAvatar(
                item,
                active,
                idx
              );


        if (active) {

          const c =
            getColorFromString(
              item.name +
              hostOf(item.url)
            );


          tile.style.setProperty(
            "--c1",
            c.c1
          );

        } else {

          avatar.append(
            el(
              "span",
              "badge",
              "Coming Soon"
            )
          );

        }


        tile.append(
          avatar,

          el(
            "span",
            "name",
            item.name
          )
        );


        frag.append(
          tile
        );

      }
    );


  container.replaceChildren(
    frag
  );
}


/* ================================================================
   INITIAL RENDER
   ================================================================ */

renderGrid(
  document.getElementById(
    "websites"
  ),
  websites,
  "site"
);


renderGrid(
  document.getElementById(
    "apps"
  ),
  apps,
  "app"
);


/* ================================================================
   INTRO
   ================================================================ */

(function intro() {

  const root =
    document.documentElement;


  const introEl =
    document.getElementById(
      "intro"
    );


  if (
    !root.classList.contains(
      "intro-on"
    )
  ) {
    return;
  }


  try {

    sessionStorage.setItem(
      "nf-intro",
      "1"
    );

  } catch (e) {}


  const INTRO_DURATION =
    4000;


  let done =
    false;


  function finish() {

    if (done) {
      return;
    }


    done =
      true;


    root.classList.add(
      "intro-leave"
    );


    setTimeout(
      () => {

        root.classList.remove(
          "intro-on",
          "intro-leave"
        );

      },
      700
    );

  }


  introEl.addEventListener(
    "click",
    finish
  );


  setTimeout(
    finish,
    INTRO_DURATION
  );

})();


/* ================================================================
   TABS
   ================================================================ */

const tabs =
  document.querySelectorAll(
    ".tab"
  );


tabs.forEach(
  tab => {

    tab.addEventListener(
      "click",
      () => {

        tabs.forEach(
          t => {

            const on =
              t === tab;


            t.setAttribute(
              "aria-selected",
              on
            );


            document.getElementById(
              t.dataset.target
            ).hidden =
              !on;

          }
        );

      }
    );

  }
);

</script>
